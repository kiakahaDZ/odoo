<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Algerian Islamic Medical Logo with Fennec -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4A7A"/>
      <stop offset="50%" stop-color="#2D6A4F"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="fennecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Islamic Pattern Background -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FFD700" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#FFD700" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="4 4"/>
  
  <!-- Fennec Fox -->
  <g transform="translate(100, 95)">
    <!-- Head -->
    <circle cx="0" cy="-15" r="20" fill="#F4A460"/>
    <!-- Ears -->
    <path d="M-18 -35 L-25 -55 L-8 -35" fill="url(#fennecGrad)"/>
    <path d="M18 -35 L25 -55 L8 -35" fill="url(#fennecGrad)"/>
    <!-- Inner ears -->
    <circle cx="-14" cy="-42" r="5" fill="#FFB6C1"/>
    <circle cx="14" cy="-42" r="5" fill="#FFB6C1"/>
    <!-- Eyes -->
    <circle cx="-8" cy="-20" r="3" fill="#2C3E50"/>
    <circle cx="8" cy="-20" r="3" fill="#2C3E50"/>
    <circle cx="-9" cy="-22" r="1" fill="white"/>
    <circle cx="7" cy="-22" r="1" fill="white"/>
    <!-- Nose -->
    <circle cx="0" cy="-10" r="4" fill="#2C3E50"/>
    <!-- Body -->
    <ellipse cx="0" cy="15" rx="25" ry="20" fill="#F4A460"/>
  </g>
  
  <!-- Islamic Crescent and Star -->
  <g transform="translate(100, 140)">
    <path d="M-15 -5 A20 20 0 1 1 5 -15" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
    <path d="M0 -12 L3 -4 L12 -4 L5 2 L8 12 L0 7 L-8 12 L-5 2 L-12 -4 L-3 -4 Z" 
          fill="url(#goldGrad)" transform="scale(0.6)"/>
  </g>
  
  <!-- Staff of Asclepius -->
  <g transform="translate(70, 120)">
    <rect x="25" y="10" width="3" height="35" rx="1.5" fill="url(#goldGrad)"/>
    <path d="M22 15 Q18 20 22 25 Q26 30 22 35 Q18 40 22 45" stroke="#2D6A4F" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Algerian Flag Elements -->
  <path d="M40 40 A15 15 0 1 1 50 25" stroke="#FF0000" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M45 30 L47 34 L51 34 L48 37 L50 41 L45 38 L40 41 L42 37 L39 34 L43 34 Z" fill="#FF0000" opacity="0.5"/>
</svg>